<script>// seed.js — hash-driven randomness architecture.
//
// Blends two methods for structuring seed generation:
//
//   Method 1 (segmentation): fixed slices of the 64-char token hash choose
//     coarse traits (grid system, palette, density, accent). Transparent and
//     legible: each trait maps to a fixed slice of the hash.
//
//   Method 3 (domain-separated sub-seeds): the full token hash plus a label
//     ("structure", "tone", "accent-detail") is mixed through cyrb53 to seed
//     an independent sfc32 stream per detail domain. Inexhaustible and
//     iteration-safe: tweaking one domain never shifts another.
//
// The entropy always comes from the token hash. The mixer (cyrb53) is
// deliberately non-cryptographic: it only separates domains, so it just needs
// to be deterministic and well-distributed, not one-way.
//
// Works in browsers (window.SeedKit) and Node (module.exports).
(function (global) {
  "use strict";

  // cyrb53: tiny non-cryptographic string hash -> 53-bit integer.
  function cyrb53(str, seed) {
    let h1 = 0xdeadbeef ^ (seed || 0);
    let h2 = 0x41c6ce57 ^ (seed || 0);
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  // sfc32: small, fast, seedable PRNG. Returns a function yielding [0, 1).
  // The Art Blocks ecosystem's standard choice for hash-seeded rendering.
  function sfc32(a, b, c, d) {
    return function () {
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
      let t = ((a + b) | 0) + d | 0;
      d = (d + 1) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    };
  }

  function streamFromInt(n) {
    const x = Math.floor(n);
    return sfc32(x >>> 0, Math.floor(x / 4294967296) >>> 0, (x * 7) >>> 0, (x * 13 + 101) >>> 0);
  }

  // Method 3: domain-separated sub-seed from the FULL token hash + label.
  // Always seed from the full hash (never a slice alone), so two tokens that
  // share a coarse trait still render different micro-detail.
  function subSeed(tokenHash, label) {
    return cyrb53(tokenHash + "::" + label);
  }

  function streamFor(tokenHash, label) {
    return streamFromInt(subSeed(tokenHash, label));
  }

  // Method 1: fixed-slice reads.
  function sliceInt(tokenHash, startChar, charLen) {
    return parseInt(tokenHash.slice(startChar, startChar + charLen), 16);
  }

  function sliceByte(tokenHash, byteIndex) {
    return sliceInt(tokenHash, byteIndex * 2, 2);
  }

  // Rarity-weighted pick: map a byte (0-255) onto entries whose weights sum to 100.
  function weightedPick(byteVal, entries) {
    const roll = (byteVal / 256) * 100;
    let acc = 0;
    for (const e of entries) {
      acc += e.weight;
      if (roll < acc) return e.key;
    }
    return entries[entries.length - 1].key;
  }

  // Deterministic demo mint hashes. NOT blockhash-derived: reproducible
  // stand-ins so the prototype renders identically everywhere. A production
  // deployment would feed the chain-derived token hash in here instead.
  //
  // Bytes are extracted arithmetically (not from hex-string prefixes) so every
  // byte is full-range uniform — slicing hex text would bias the top byte,
  // since a 53-bit value's leading hex digit only carries 5 bits.
  function demoMintHash(i) {
    const bytes = [];
    let n = 0;
    while (bytes.length < 32) {
      let x = cyrb53("tidal-geometries::mint::" + i + ":" + n++);
      for (let b = 0; b < 6 && bytes.length < 32; b++) {
        bytes.push(x % 256);
        x = Math.floor(x / 256);
      }
    }
    return bytes
      .map(function (byte) { return byte.toString(16).padStart(2, "0"); })
      .join("");
  }

  const SeedKit = {
    cyrb53: cyrb53,
    sfc32: sfc32,
    streamFromInt: streamFromInt,
    subSeed: subSeed,
    streamFor: streamFor,
    sliceInt: sliceInt,
    sliceByte: sliceByte,
    weightedPick: weightedPick,
    demoMintHash: demoMintHash,
  };

  if (typeof module !== "undefined" && module.exports) module.exports = SeedKit;
  else global.SeedKit = SeedKit;
})(typeof self !== "undefined" ? self : this);
</script>
<script>// traits.js — Method 1 coarse trait derivation, exclusion rules, and rarity.
//
// Tidal Geometries trait map. Bytes 0–4 keep the Seeded Geometries v1 slice
// semantics (same byte positions, same weight structures, same derivation
// logic — including the deliberate hue-pool fall-through skew), so the two
// series stay legible as siblings:
//
//   byte 0 (chars 0-1)  -> grid system  (ring/grid composite, two stack orders)
//   byte 1 (chars 2-3)  -> palette     (single signature palette)
//   byte 2 (chars 4-5)  -> density     (also sets the ring count)
//   byte 3 (chars 6-7)  -> accent
//   byte 4 (chars 8-9)  -> first accent hue (rarity-weighted); bold pieces
//                           extend it to a set of 2-3 via the "traits:hues"
//                           domain stream below
//
// New in Tidal Geometries (bytes 5+):
//
//   byte 5 (chars 10-11) -> dot grid: where the accent-dot layer places its
//                           dots — "square" (35): the linear grid's square-
//                           grid intersections (the original behavior);
//                           "triangle" (40): interior third-points of each
//                           module in the base-layer frame (the vertices a
//                           triangulated module adds beyond its corners —
//                           v1's TRI_SUBDIV=3 language); "circle" (25):
//                           ring/spoke crossing points of the ring lattice.
//                           Weights per the director 2026-09-27 (triangle
//                           favored).
//   byte 6 (chars 12-13) -> wave trains: double (series-locked)
//
// Ring count is DERIVED from the density trait via DENSITY_RINGS below
// (sparse -> 3, standard -> 6, dense -> 9), not a separate slice — density
// already controls module count, so a second ring-count slice would be
// redundant. When the renderer is built, consume DENSITY_RINGS from this
// module — do not hard-code a second table. Spoke count is
// seeded fine detail via a Method 3 domain stream ("rings:spokes"), not a
// coarse trait.
//
// Each byte is mapped through rarity weights (weightedPick).
(function (global) {
  "use strict";

  const SeedKit = typeof require !== "undefined" ? require("./seed.js") : global.SeedKit;

  // Grid systems are composites: every mint renders each listed system in
  // draw order (first entry = bottom layer), so both fields combine in each
  // piece. Same composite structure as v1 — the triangle field is replaced
  // by the ring field; the two stack orders (and their 70/30 weights) are
  // unchanged.
  const GRIDS = [
    { key: "fusion", label: "Ring Field \u2295 Linear Grid", weight: 70,
      systems: ["rings", "linear"] },
    { key: "fusion-inv", label: "Linear Grid \u2295 Ring Field", weight: 30,
      systems: ["linear", "rings"] },
  ];

  const PALETTES = [
    { key: "abyssal", label: "Abyssal Bioluminescent", weight: 100 },
  ];

  const DENSITIES = [
    { key: "sparse",   label: "Sparse",   weight: 25 },
    { key: "standard", label: "Standard", weight: 50 },
    { key: "dense",    label: "Dense",    weight: 25 },
  ];

  // Ring count derived from density — one fewer slice, zero redundancy.
  const DENSITY_RINGS = { sparse: 3, standard: 6, dense: 9 };

  const ACCENTS = [
    { key: "classic",    label: "Classic",    weight: 30 },
    { key: "restrained", label: "Restrained", weight: 45 },
    { key: "bold",       label: "Bold",       weight: 25 },
  ];

  // Accent colors: bioluminescent warms (amber/coral/ember). Weights preserve
  // the 3:2:2 ratio from the original 30/30/20/20 table.
  // Every piece carries the same accent-dot architecture; the accent trait
  // only sets the color treatment — classic and restrained carry one hue,
  // bold carries two or three distinct hues.
  const ACCENT_HUES = [
    { key: "amber",  label: "Amber",  weight: 43 },
    { key: "coral",  label: "Coral",  weight: 29 },
    { key: "ember",  label: "Ember",  weight: 28 },
  ];

  // Wave trains: how many expanding wavefronts chase each other through the
  // 8s loop's motion window. Series-locked to double — every piece rides
  // two wavefronts per loop.
  const WAVE_TRAINS = [
    { key: 2, label: "Double", weight: 100 },
  ];

  // Dot grid: which vertex set the accent-dot layer places its dots on.
  // "square" is the original behavior (linear-grid intersections);
  // "triangle" and "circle" re-seat the same dot architecture (same counts,
  // same colors, same wave flight) onto the other two lattice vertex sets.
  // Only the placement set changes — dot rendering is identical.
  const DOT_GRIDS = [
    { key: "square",   label: "Square",   weight: 35 },
    { key: "triangle", label: "Triangle", weight: 40 },
    { key: "circle",   label: "Circle",   weight: 25 },
  ];

  // No exclusion rules: the pool is the single ring/grid composite, so no
  // combination can collide.

  // The accent-color set: classic and restrained pieces get one hue, bold
  // pieces get two or three distinct hues. Deterministic per hash.
  //
  // NOTE — distribution skew, kept deliberately (inherited from v1):
  // weightedPick rolls uniform [0,100) but the filtered pool's weights sum
  // to <100, so the fall-through returns the last entry some of the time.
  // Deterministic — do not "fix" without accepting render changes.
  function deriveHueSet(tokenHash, accent) {
    const first = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 4), ACCENT_HUES);
    if (accent === "classic" || accent === "restrained") return [first];
    const rng = SeedKit.streamFor(tokenHash, "traits:hues");
    const want = 2 + Math.floor(rng() * 2); // bold carries 2–3 distinct hues
    const set = [first];
    let pool = ACCENT_HUES.filter(function (h) { return h.key !== first; });
    while (set.length < want && pool.length) {
      const pick = SeedKit.weightedPick(Math.floor(rng() * 256), pool);
      set.push(pick);
      pool = pool.filter(function (h) { return h.key !== pick; });
    }
    return set;
  }

  function deriveTraits(tokenHash) {
    const grid = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 0), GRIDS);
    const palette = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 1), PALETTES);
    const density = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 2), DENSITIES);
    const accent = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 3), ACCENTS);
    const hue = deriveHueSet(tokenHash, accent);
    const dotGrid = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 5), DOT_GRIDS);
    const trains = SeedKit.weightedPick(SeedKit.sliceByte(tokenHash, 6), WAVE_TRAINS);
    return { grid: grid, palette: palette, density: density, accent: accent,
             hue: hue, dotGrid: dotGrid, trains: trains,
             rings: DENSITY_RINGS[density] };
  }

  function labelFor(table, key) {
    const e = table.find(function (x) { return x.key === key; });
    return e ? e.label : key;
  }

  // Marketplace-style trait metadata: [{ trait_type, value }].
  // Pure function of the hash, so traits can be verified without rendering.
  function features(tokenHash) {
    const t = deriveTraits(tokenHash);
    return [
      { trait_type: "Grid System", value: labelFor(GRIDS, t.grid) },
      { trait_type: "Palette", value: labelFor(PALETTES, t.palette) },
      { trait_type: "Density", value: labelFor(DENSITIES, t.density) },
      { trait_type: "Rings", value: String(t.rings) },
      { trait_type: "Wave Trains", value: labelFor(WAVE_TRAINS, t.trains) },
      { trait_type: "Dot Grid", value: labelFor(DOT_GRIDS, t.dotGrid) },
      { trait_type: "Accent", value: labelFor(ACCENTS, t.accent) },
      { trait_type: "Accent Hue", value: t.hue.length
        ? t.hue.map(function (k) { return labelFor(ACCENT_HUES, k); }).join(" + ")
        : "None" },
    ];
  }

  // Order-insensitive comparison so hue sets compare as sets.
  function traitEq(a, b) {
    const ka = Array.isArray(a) ? a.slice().sort().join("+") : a;
    const kb = Array.isArray(b) ? b.slice().sort().join("+") : b;
    return ka === kb;
  }

  // Classic PFP rarity score: sum over traits of (population / trait count).
  // Higher = rarer.
  function scoreRarity(populationTraits, traits) {
    const n = populationTraits.length;
    let score = 0;
    ["grid", "palette", "density", "rings", "trains", "dotGrid", "accent", "hue"].forEach(function (k) {
      const count = populationTraits.filter(function (p) { return traitEq(p[k], traits[k]); }).length;
      score += n / Math.max(1, count);
    });
    return score;
  }

  // Resolve a grid trait key to its ordered list of renderer systems
  // (bottom layer first). Solo keys resolve to themselves.
  function compositeFor(gridKey) {
    const entry = GRIDS.find(function (g) { return g.key === gridKey; });
    if (entry && Array.isArray(entry.systems) && entry.systems.length) return entry.systems.slice();
    return [gridKey];
  }

  const TGTraits = {
    GRIDS: GRIDS,
    PALETTES: PALETTES,
    DENSITIES: DENSITIES,
    DENSITY_RINGS: DENSITY_RINGS,
    ACCENTS: ACCENTS,
    ACCENT_HUES: ACCENT_HUES,
    WAVE_TRAINS: WAVE_TRAINS,
    DOT_GRIDS: DOT_GRIDS,
    deriveTraits: deriveTraits,
    compositeFor: compositeFor,
    features: features,
    scoreRarity: scoreRarity,
  };

  if (typeof module !== "undefined" && module.exports) module.exports = TGTraits;
  else global.TGTraits = TGTraits;
})(typeof self !== "undefined" ? self : this);
</script>
<script>// layers.js — dynamic layer decks composited beneath the procedural systems.
//
// Tidal Geometries ships dynamic-only decks: every layer is a procedural
// tile generated at render time (the "undulate" flow-field), so the series
// needs no PNG assets and every deck is palette-native. Each grid system
// ("rings", "linear") owns its deck; everything about placement (instances,
// position, rotation, scale, opacity, blend) comes from the Method 3 seeded
// streams, so the composition stays fully deterministic per hash. Dynamic
// tiles get their own domain-separated stream ("layer:<name>:<index>"), so
// generating a tile never shifts the base detail streams.
//
// Determinism note: a deck is loaded once, then render() consumes the seeded
// streams in fixed order (layers first, systems second).
(function (global) {
  "use strict";

  const SeedKit = typeof require !== "undefined" ? require("./seed.js") : global.SeedKit;

  function lerp(range, t) { return range[0] + t * (range[1] - range[0]); }

  // Dynamic (procedural) layer generators. Unlike file decks, these draw
  // their tile at render time on an offscreen canvas. The tile's internal
  // structure comes from its own domain-separated stream ("layer:<name>:<n>"),
  // so generating a tile never shifts the base detail streams.
  //
  //   tctx   — 2d context of a square tile canvas
  //   size   — tile size in px (256)
  //   rs     — () => [0,1) seeded stream for this tile
  //   P      — active palette ({ ink, ... })
  //   params — ranges from the deck entry
  const DYNAMIC = {
    // Undulating flow field: horizontal contour lines displaced by a sum of
    // seeded sine waves — deep-water current lines under the ring lattice.
    // Uniformity via π: wave phases are multiples of π/4, all offset by the
    // token's shared π-phase, and the cycle count across the tile is a
    // multiple of π (cycles = π·w/2 for the seeded w in params.waves).
    undulate: function (tctx, size, rs, P, params) {
      params = params || {};
      const TAU = Math.PI * 2;
      const phase = params.phase || 0;
      const lines = Math.floor(lerp(params.lines || [36, 70], rs()));
      const nWaves = 2 + Math.floor(rs() * 2); // 2-3 sine components
      const piPhase = params.piPhase || 0;
      // Loop-phase drift: 0 at phase 0 and phase 1, so the tile (and the
      // whole piece) closes seamlessly. Pinned exactly at the endpoints:
      // sin(TAU) is ~1e-16, not 0, in floats.
      const driftArg = (phase === 0 || phase === 1) ? 0 : Math.sin(TAU * phase);
      const drift = (params.drift == null ? 0.7 : params.drift) * driftArg;
      const waves = [];
      for (let k = 0; k < nWaves; k++) {
        waves.push({
          amp: lerp(params.amp || [0.03, 0.08], rs()) * size, // as fraction of tile
          len: size / (Math.PI * lerp(params.waves || [1, 2.5], rs()) / 2),
          ph: piPhase + Math.floor(rs() * 8) * Math.PI / 4 + drift,
        });
      }
      tctx.strokeStyle = P.ink;
      tctx.lineWidth = Math.max(0.5, size / 640);
      tctx.lineCap = "round";
      for (let i = 0; i < lines; i++) {
        const baseY = ((i + 0.5) / lines) * size;
        tctx.globalAlpha = 0.22 + rs() * 0.4;
        tctx.beginPath();
        for (let x = -8; x <= size + 8; x += 4) {
          let y = baseY;
          for (const w of waves) y += Math.sin((x / w.len) * Math.PI * 2 + w.ph) * w.amp;
          if (x === -8) tctx.moveTo(x, y);
          else tctx.lineTo(x, y);
        }
        tctx.stroke();
      }
      tctx.globalAlpha = 1;
    },
  };

  // Tile factory for dynamic layers; override in Node tests via
  // TGLayers._tileFactory (browsers use an offscreen canvas).
  function defaultTileFactory(size) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    return c;
  }

  // Deck registry, keyed by grid-system key from traits.js.
  //
  //   dynamic — name of a DYNAMIC generator; tile drawn at render time (dynamic layers)
  //   params  — generator-specific ranges, e.g. { lines, amp, waves } for "undulate"
  //   blend   — canvas globalCompositeOperation ("source-over", "multiply", ...)
  //   alpha   — [min, max] opacity range; the seeded tone stream picks within it
  //   scale   — [min, max] layer size as a fraction of the piece size
  //   count   — [min, max] instances of this layer per piece
  //   rotate  — max rotation in radians (0 = axis-aligned)
  const LAYER_DECKS = {
    rings: [
      { dynamic: "undulate", blend: "source-over", alpha: [0.05, 0.12], scale: [0.9, 1.4], count: [1, 2], rotate: 0.5,
        params: { lines: [40, 76], amp: [0.03, 0.08], waves: [2, 5] } },
      { dynamic: "undulate", blend: "source-over", alpha: [0.04, 0.10], scale: [0.6, 1.1], count: [1, 2], rotate: 1.0,
        params: { lines: [52, 90], amp: [0.02, 0.06], waves: [3, 6] } },
    ],
    linear: [
      { dynamic: "undulate", blend: "source-over", alpha: [0.05, 0.12], scale: [0.9, 1.4], count: [1, 2], rotate: 0.5,
        params: { lines: [36, 70], amp: [0.03, 0.08], waves: [2, 5] } },
    ],
  };

  // Load every deck. Returns a Promise of { systemKey: [{ img, cfg }, ...] }.
  // Dynamic entries need no loading — their tiles are generated at render.
  // makeImage is injectable for tests; in the browser it defaults to Image.
  function loadLayers(decks, makeImage) {
    decks = decks || LAYER_DECKS;
    const make = makeImage || function () { return new Image(); };
    const keys = Object.keys(decks);
    const out = {};
    const jobs = [];
    keys.forEach(function (key) {
      out[key] = [];
      decks[key].forEach(function (cfg) {
        if (cfg.dynamic) {
          if (typeof DYNAMIC[cfg.dynamic] !== "function" && typeof console !== "undefined")
            console.warn("[layers] unknown dynamic layer: " + cfg.dynamic);
          out[key].push({ img: null, cfg: cfg });
          return;
        }
        jobs.push(new Promise(function (resolve) {
          const img = make();
          img.onload = function () { out[key].push({ img: img, cfg: cfg }); resolve(); };
          img.onerror = function () {
            if (typeof console !== "undefined") console.warn("[layers] missing: " + cfg.file);
            resolve(); // skip missing layers, keep the gallery alive
          };
          img.src = cfg.file;
        }));
      });
    });
    return Promise.all(jobs).then(function () { return out; });
  }

  // Composite a loaded deck under the procedural linework. All layout values
  // come from the seeded streams: same hash + same assets => same composition.
  // R: { sStruct, sTone, sAccent } stream functions from SeedKit.streamFor.
  // tokenHash + P feed dynamic tile generation (own sub-stream, palette ink).
  // ns: optional namespace for dynamic tile streams, so two decks composited
  // into one piece never generate identical tiles ("", the default, keeps the
  // legacy stream labels).
  // Simulation: consumes all layer streams, generates dynamic tiles, and
  // returns placements {img, dw, dh, x, y, rot, a, blend}. W and H are the
  // canvas size (square: S×S).
  function planLayers(W, H, deck, R, tokenHash, P, phase, ns) {
    if (!deck || !deck.length) return [];
    phase = phase || 0;
    // Uniform π-phase: one harmonic angle per token, shared by every layer
    // in the piece. All rotations are quantized to eighths of π around it,
    // so the layers sit on a common harmonic lattice instead of drifting on
    // independent random angles.
    const PI_STEP = Math.PI / 8;
    const piPhase = Math.floor(R.sStruct() * 8) * (Math.PI / 4);
    const makeTile = TGLayers._tileFactory || defaultTileFactory;
    const SU = Math.min(W, H);
    const out = [];
    deck.forEach(function (entry, di) {
      const cfg = entry.cfg;
      let img = entry.img;
      if (cfg.dynamic) {
        const gen = DYNAMIC[cfg.dynamic];
        if (typeof gen !== "function") return; // warned at load time
        const tile = makeTile(256);
        const rs = SeedKit.streamFor(tokenHash, "layer:" + (ns ? ns + ":" : "") + cfg.dynamic + ":" + di);
        const genParams = Object.assign({}, cfg.params, { piPhase: piPhase, phase: phase });
        gen(tile.getContext("2d"), 256, rs, P || { ink: "#e9e3d3" }, genParams);
        img = tile;
      }
      if (!img) return;
      const n = cfg.count[0] + Math.floor(R.sStruct() * (cfg.count[1] - cfg.count[0] + 1));
      for (let i = 0; i < n; i++) {
        const sc = (cfg.scale[0] + R.sStruct() * (cfg.scale[1] - cfg.scale[0])) * (SU / 256);
        const dw = img.width * sc, dh = img.height * sc;
        // allow bleed past the edges so layers never sit in a neat inset box
        const x = R.sStruct() * (W + dw) - dw / 2;
        const y = R.sStruct() * (H + dh) - dh / 2;
        // Harmonic rotation: jitter around the shared π-phase, snapped to π/8.
        const rawRot = (R.sStruct() - 0.5) * 2 * (cfg.rotate || 0);
        const rot = Math.round((piPhase + rawRot) / PI_STEP) * PI_STEP;
        const a = cfg.alpha[0] + R.sTone() * (cfg.alpha[1] - cfg.alpha[0]);
        out.push({ img: img, dw: dw, dh: dh, x: x, y: y, rot: rot, a: a,
                   blend: cfg.blend || "source-over" });
      }
    });
    return out;
  }

  // Raster: draws placements.
  function drawPlacements(ctx, placements) {
    placements.forEach(function (pl) {
      ctx.save();
      ctx.globalCompositeOperation = pl.blend;
      ctx.globalAlpha = pl.a;
      ctx.translate(pl.x + pl.dw / 2, pl.y + pl.dh / 2);
      ctx.rotate(pl.rot);
      ctx.drawImage(pl.img, -pl.dw / 2, -pl.dh / 2, pl.dw, pl.dh);
      ctx.restore();
    });
  }

  function composeLayers(ctx, S, deck, R, tokenHash, P, phase, ns) {
    drawPlacements(ctx, planLayers(S, S, deck, R, tokenHash, P, phase, ns));
  }

  const TGLayers = {
    LAYER_DECKS: LAYER_DECKS,
    DYNAMIC: DYNAMIC,

// welded vertex, so no line ever crosses another without joining it.

  // farthest center, so the full [0, WAVE_DMAX] delay range always spans
  // what the viewer sees — every wave genuinely sweeps edge to edge.
  function waveField(centers, region) {
    const r = region || [0, 0, 1, 1];
    let maxD = 0.001;
    centers.forEach(function (c) {
      [[r[0], r[1]], [r[2], r[1]], [r[0], r[3]], [r[2], r[3]]].forEach(function (q) {

        const d = Math.sqrt(dx * dx + dy * dy);

  const WAVE_DMAX = 0.20 / 1.12;

  // One shard's delay from the field: 0 at the nearest ring center,
  // WAVE_DMAX at the farthest visible corner, plus a small seeded jitter.
  // The radial profile is a quarter sine — π/2 of spatial phase across the
  // piece — so the wavefront punches out fast near each focus and
  // decelerates toward the far edge, lingering there before the return.
  // With 2 foci each point follows its nearest center's wave (a Voronoi
  // wavefront), so the waves read as concentric around every focus.
  function waveDelay(f, x, y, ju) {
    let rMin = Infinity;
    for (let i = 0; i < f.centers.length; i++) {
      const c = f.centers[i];
      const dx = x - c.x, dy = y - c.y;
      const r = Math.sqrt(dx * dx + dy * dy) / f.maxD;
      if (r < rMin) rMin = r;
    }

    return Math.min(WAVE_DMAX, Math.max(0, d));
  }

  // --- The welded ring lattice ------------------------------------------------
  // One square module, shared by every layer and every trait. The linear
  // grid draws true squares on the module lines; the ring field grows
  // concentric rings from each seeded focus at the seeded lattice radii
  // mod·√(i²+j²) (deduped on the integer i²+j², shared across foci) —
  // plus seeded spokes radiating from each focus. In the base layer each
  // ring is a polygon whose corners snap bit-exactly onto the lattice
  // vertices ((bi+i)·mod, (bj+j)·mod) with i²+j²===n (integer arithmetic,
  // no trig), subdivided between corners to ≤2π/64 smoothness; the
  // rotated layers keep uniform 64-gons and make no lattice claim.
  // Within a layer, every vertex is a multiple of u = mod/3 — the same
  // proportional system — so the linear grids are perfect squares. The
  // rotated duplicates occupy rotated copies of that lattice. Every
  // crossing or touch between any two edges — within a layer or across
  // layers — is a welded vertex, so no line ever crosses another without
  // joining it; in the base layer, ring/spoke/grid triple points fuse to
  // a single vertex exactly on the lattice point.
  //
  // Spoke count and angles are pure Method 3 draws ("rings:spokes") — fine

  // focus count is series-locked at 2; their positions are seeded.
  //
  // LAYER_DIM sets each layer's alpha multiplier. All layers render at equal
  // transparency (no depth dimming) so the three rotated lattices read as one
  // unified field rather than a foreground/background stack — at 66% alpha.
  // The whole composition is turned 75° clockwise on screen (positive angle
  // reads clockwise in canvas y-down coordinates); the duplicates stay at
  // exactly +30°/+60° relative to the base layer.
  //
  // LAYER_TINT gives each rotated lattice its own tone: pale teal on the
